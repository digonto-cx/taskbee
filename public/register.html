<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBee - একাউন্ট তৈরি করুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>

    <!-- কাস্টম স্মুথ এনিমেশন সিএসএস -->
    <style>
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.96) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.1); }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }
        .animate-card-pop { animation: cardPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-glow { animation: pulseGlow 6s ease-in-out infinite; }
        
        .input-group:focus-within label {
            color: #d97706;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50/40 via-white to-yellow-50/50 min-h-screen flex items-center justify-center p-4 text-gray-800 selection:bg-yellow-400 selection:text-black">

    <!-- পেজ ব্যাকগ্রাউন্ড লাইট ব্লার গ্লো -->
    <div class="fixed top-12 left-1/2 -translate-x-1/2 w-80 h-80 bg-yellow-400/20 rounded-full blur-3xl pointer-events-none animate-glow"></div>

    <div class="max-w-md w-full my-6 relative z-10 animate-card-pop">

        <!-- মেইন প্রিমিয়াম কার্ড -->
        <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-8 rounded-[32px] shadow-2xl shadow-yellow-500/10 border border-yellow-200/70 space-y-6 relative overflow-hidden transition-all duration-300">
            
            <!-- টপ ব্র্যান্ড ও হেডার (কোনো প্রমোশনাল লেখা ছাড়া) -->
            <div class="text-center space-y-2.5">
                <!-- মৌমাছি লোগো (ভাসমান এনিমেশন) -->
                <div class="w-16 h-16 rounded-3xl bg-yellow-400/20 border border-yellow-400/50 p-2 mx-auto flex items-center justify-center shadow-xs animate-float">
                    <img src="https://i.ibb.co.com/PZV16bNp/file-00000000bea481f5b7ca59b2fe930fea.png" alt="TaskBee" class="w-full h-full object-contain">
                </div>

                <div>
                    <h2 class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">নতুন একাউন্ট</h2>
                    <p class="text-xs text-gray-400 font-medium mt-0.5">TaskBee-তে যুক্ত হতে আপনার সঠিক তথ্য দিন</p>
                </div>
            </div>

            <!-- রেজিস্ট্রেশন ফর্ম -->
            <form id="regForm" class="space-y-4">
                
                <!-- পুরো নাম -->
                <div class="input-group space-y-1">
                    <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider transition duration-200">পুরো নাম</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="name" placeholder="আপনার নাম লিখুন" required 
                               class="w-full text-xs pl-9 pr-3 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200">
                    </div>
                </div>

                <!-- ইমেইল এড্রেস -->
                <div class="input-group space-y-1">
                    <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider transition duration-200">ইমেইল এড্রেস</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" placeholder="example@mail.com" required 
                               class="w-full text-xs pl-9 pr-3 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200">
                    </div>
                </div>

                <!-- পাসওয়ার্ড (Eye Icon Toggle) -->
                <div class="input-group space-y-1">
                    <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider transition duration-200">গোপন পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" minlength="6" placeholder="কমপক্ষে ৬ অক্ষর দিন" required 
                               class="w-full text-xs pl-9 pr-10 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200">
                        <button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-black transition">
                            <i id="eyeIcon" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- ৫ ডিজিট রেফার কোড (ঐচ্ছিক) -->
                <div class="input-group space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider transition duration-200">রেফারেল কোড (৫ ডিজিট আইডি)</label>
                        <span class="text-[10px] text-gray-400 font-bold bg-gray-100 px-1.5 py-0.2 rounded-md">ঐচ্ছিক</span>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-solid fa-ticket"></i>
                        </span>
                        <input type="text" id="referred_by" maxlength="5" placeholder="যেমন: 58210" 
                               class="w-full text-xs pl-9 pr-3 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200 font-mono tracking-widest">
                    </div>
                </div>

                <!-- ডিভাইস সুরক্ষা নোট -->
                <div class="p-3 bg-gray-50/80 rounded-2xl border border-gray-100 flex items-center gap-2.5 text-[11px] text-gray-500">
                    <i class="fa-solid fa-shield-halved text-yellow-600 text-xs flex-shrink-0"></i>
                    <span>একটি ডিভাইস থেকে কেবল একটি অ্যাকাউন্ট খোলা অনুমোদিত।</span>
                </div>

                <!-- সাবমিট বাটন (ইন্টারেক্টিভ স্কেল এনিমেশন সহ) -->
                <button type="submit" id="regBtn" class="w-full py-3.5 bg-yellow-400 hover:bg-yellow-500 font-black rounded-2xl text-xs text-gray-950 flex items-center justify-center gap-2 shadow-md shadow-yellow-500/25 hover:shadow-yellow-500/35 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-200">
                    একাউন্ট তৈরি করুন <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <!-- লগইন ফুটার রিডাইরেক্ট -->
            <p class="text-xs text-center text-gray-400 pt-3 border-t border-gray-100">
                ইতিমধ্যে একাউন্ট আছে? <a href="/login" class="text-yellow-600 font-black hover:underline ml-1">লগইন করুন</a>
            </p>

        </div>

    </div>

    <!-- স্ক্রিপ্ট লজিক -->
    <script>
        // ১. ইনভাইট লিংক থেকে রেফার কোড অটো-ডিটেক্ট (?ref=XXXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('ref');
        if (refParam) {
            document.getElementById('referred_by').value = refParam;
        }

        // ২. পাসওয়ার্ড শো / হাইড টগল
        function togglePassVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.className = "fa-solid fa-eye-slash text-xs text-yellow-600";
            } else {
                passInput.type = "password";
                eyeIcon.className = "fa-solid fa-eye text-xs text-gray-400";
            }
        }

        // ৩. ফর্ম সাবমিশন ও ডিভাইস লক চেক
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> একাউন্ট তৈরি হচ্ছে...`;
            btn.disabled = true;

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                device_id: getDeviceFingerprint(), // ১ ডিভাইসে ১ একাউন্ট লক
                referred_by: document.getElementById('referred_by').value.trim() || null
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(`অভিনন্দন! আপনার একাউন্ট সফলভাবে তৈরি হয়েছে। আপনার ৫ ডিজিটের রেফারেল আইডি হলো: ${data.user_id}`);
                window.location.href = "/login";
            } catch (err) {
                alert(err.message);
                btn.innerHTML = `একাউন্ট তৈরি করুন <i class="fa-solid fa-arrow-right text-[10px]"></i>`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
