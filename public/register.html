<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBee - নতুন একাউন্ট খুলুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/main.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md max-w-md w-full border border-yellow-400">
        <h2 class="text-2xl font-black text-center text-gray-900 mb-1">TaskBee একাউন্ট তৈরি</h2>
        <p class="text-xs text-center text-gray-500 mb-6">রেফার কোড থাকলে আপনিও পাবেন ২০ টাকা বোনাস!</p>

        <form id="regForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">আপনার পুরো নাম</label>
                <input type="text" id="name" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">ইমেইল এড্রেস</label>
                <input type="email" id="email" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">পাসওয়ার্ড</label>
                <input type="password" id="password" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">রেফার কোড (কারো ৫ ডিজিট আইডি থাকলে দিন)</label>
                <input type="text" id="referred_by" maxlength="5" placeholder="যেমন: 58214" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>

            <button type="submit" id="btn" class="w-full py-3 bg-yellow-400 font-bold rounded-xl hover:bg-yellow-500 transition shadow-sm">একাউন্ট তৈরি করুন</button>
        </form>

        <p class="text-sm text-center text-gray-600 mt-5">
            আগে থেকেই একাউন্ট আছে? <a href="/login.html" class="text-yellow-600 font-bold hover:underline">লগইন করুন</a>
        </p>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "যাচাই করা হচ্ছে...";
            btn.disabled = true;

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                device_id: getDeviceFingerprint(), // এক ডিভাইসে একটা একাউন্টের আইডি
                referred_by: document.getElementById('referred_by').value || null
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(`অভিনন্দন! আপনার একাউন্ট সফলভাবে তৈরি হয়েছে। আপনার ৫ ডিজিটের রেফারেল আইডি হলো: ${data.user_id}`);
                window.location.href = "/login.html";
            } catch (err) {
                alert(err.message);
                btn.innerText = "একাউন্ট তৈরি করুন";
                btn.disabled = false;
            }
        });
    </script>
</body>
              </html>
