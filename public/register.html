<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBee - একাউন্ট খুলুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 text-gray-800">

    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100 space-y-5">
        
        <!-- ব্র্যান্ড লোগো ও হেডার -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-3xl bg-yellow-400/20 border border-yellow-400/40 p-2 mx-auto flex items-center justify-center shadow-xs">
                <img src="https://cdn-icons-png.flaticon.com/512/1888/1888375.png" alt="TaskBee" class="w-full h-full object-contain">
            </div>
            <h2 class="text-2xl font-black text-gray-900 tracking-tight">নতুন একাউন্ট খুলুন</h2>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-yellow-50 border border-yellow-200 rounded-full text-[11px] font-bold text-yellow-800">
                <i class="fa-solid fa-gift text-yellow-600"></i> রেফার কোড দিলে আপনিও পাবেন ২০৳ বোনাস!
            </div>
        </div>

        <!-- রেজিস্ট্রেশন ফর্ম -->
        <form id="regForm" class="space-y-3.5">
            <!-- নাম -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">আপনার পুরো নাম</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="name" placeholder="যেমন: মোঃ সাকিব হাসান" required 
                           class="w-full text-xs pl-9 pr-3 py-2.5 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50 focus:bg-white transition">
                </div>
            </div>

            <!-- ইমেইল -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ইমেইল এড্রেস</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" placeholder="example@mail.com" required 
                           class="w-full text-xs pl-9 pr-3 py-2.5 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50 focus:bg-white transition">
                </div>
            </div>

            <!-- পাসওয়ার্ড -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" minlength="6" placeholder="••••••••" required 
                           class="w-full text-xs pl-9 pr-10 py-2.5 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50 focus:bg-white transition">
                    <button type="button" onclick="togglePasswordVisibility('password', 'regEyeIcon')" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-black">
                        <i id="regEyeIcon" class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- ৫ ডিজিট রেফার কোড -->
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">রেফারেল কোড (৫ ডিজিট আইডি) - ঐচ্ছিক</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                        <i class="fa-solid fa-gift"></i>
                    </span>
                    <input type="text" id="referred_by" maxlength="5" placeholder="যেমন: 45892" 
                           class="w-full text-xs pl-9 pr-3 py-2.5 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50 focus:bg-white transition font-mono">
                </div>
            </div>

            <!-- সাবমিট বাটন -->
            <button type="submit" id="regBtn" class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 font-bold rounded-2xl text-xs text-gray-950 flex items-center justify-center gap-2 shadow-sm transition">
                একাউন্ট তৈরি করুন <i class="fa-solid fa-user-plus text-[10px]"></i>
            </button>
        </form>

        <!-- ফুটার লিংক -->
        <p class="text-xs text-center text-gray-500 pt-2 border-t border-gray-100">
            ইতিমধ্যে একাউন্ট আছে? <a href="/login" class="text-yellow-600 font-bold hover:underline">লগইন করুন</a>
        </p>

    </div>

    <script>
        // ইউআরএল থেকে রেফার কোড অটো-ডিটেক্ট (?ref=XXXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('ref');
        if (refParam) {
            document.getElementById('referred_by').value = refParam;
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash text-xs";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye text-xs";
            }
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> যাচাই হচ্ছে...`;
            btn.disabled = true;

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                device_id: getDeviceFingerprint(), // ১ ডিভাইসে ১ একাউন্ট লক
                referred_by: document.getElementById('referred_by').value.trim() || null
            };

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(`অভিনন্দন! আপনার একাউন্ট সফলভাবে তৈরি হয়েছে। আপনার ৫ ডিজিটের রেফারেল আইডি হলো: ${data.user_id}`);
                window.location.href = "/login";
            } catch (err) {
                alert(err.message);
                btn.innerHTML = `একাউন্ট তৈরি করুন <i class="fa-solid fa-user-plus text-[10px]"></i>`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
