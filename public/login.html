<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBee - লগইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/main.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md max-w-md w-full border border-yellow-400">
        <h2 class="text-2xl font-black text-center text-gray-900 mb-2">TaskBee লগইন</h2>
        <p class="text-xs text-center text-gray-500 mb-6">আপনার অ্যাকাউন্টে প্রবেশ করতে তথ্য দিন</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">ইমেইল এড্রেস</label>
                <input type="email" id="email" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase">পাসওয়ার্ড</label>
                <input type="password" id="password" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none text-sm">
            </div>

            <button type="submit" id="btn" class="w-full py-3 bg-yellow-400 font-bold rounded-xl hover:bg-yellow-500 transition shadow-sm">লগইন করুন</button>
        </form>

        <p class="text-sm text-center text-gray-600 mt-5">
            নতুন একাউন্ট করতে চান? <a href="/register.html" class="text-yellow-600 font-bold hover:underline">এখানে ক্লিক করুন</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "লগইন হচ্ছে...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                // সেশন সেভ করা
                setAuth(data.token, data.user);

                // রোল অনুযায়ী রিডাইরেক্ট
                if (data.user.role === 'admin') {
                    window.location.href = "/admin/index.html";
                } else {
                    window.location.href = "/dashboard.html";
                }
            } catch (err) {
                alert(err.message);
                btn.innerText = "লগইন করুন";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
