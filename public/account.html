<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অ্যাকাউন্ট - TaskBee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>

    <style>
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50/30 via-white to-yellow-50/40 min-h-screen text-gray-800 pb-28 sm:pb-14 selection:bg-yellow-400">
    <script>checkAuth();</script>

    <!-- ব্যাকগ্রাউন্ড অ্যাম্বিয়েন্ট গ্লো -->
    <div class="fixed top-8 left-1/2 -translate-x-1/2 w-96 h-96 bg-yellow-400/15 rounded-full blur-3xl pointer-events-none"></div>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6 relative z-10">

        <!-- ১. প্রোফাইল হেডার কার্ড (নতুন মৌমাছি এভাটার সহ) -->
        <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-7 rounded-[32px] border border-yellow-200/70 shadow-xl shadow-yellow-500/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5">
            <div class="flex items-center gap-4">
                
                <!-- ট্রান্সপারেন্ট মৌমাছি এভাটার -->
                <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-yellow-400 to-amber-300 p-0.5 shadow-md shadow-yellow-400/30 flex items-center justify-center flex-shrink-0 animate-float">
                    <div class="w-full h-full bg-white rounded-[22px] flex items-center justify-center p-2">
                        <img src="https://i.ibb.co.com/ZZ1GyTp/3011-removebg-preview.png" alt="Bee Avatar" class="w-full h-full object-contain filter drop-shadow-xs">
                    </div>
                </div>

                <div>
                    <h2 id="accName" class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">লোড হচ্ছে...</h2>
                    <p id="accEmail" class="text-xs text-gray-400 font-medium">email@example.com</p>
                    
                    <div class="flex items-center gap-2 mt-1.5">
                        <span class="text-xs text-gray-500 font-medium">রেফারেল আইডি:</span>
                        <span id="accRefId" class="text-xs font-mono font-black text-yellow-700 bg-yellow-50 border border-yellow-200 px-2 py-0.5 rounded-lg tracking-widest">-----</span>
                        <button onclick="copyCodeText()" title="কপি করুন" class="text-xs text-gray-400 hover:text-black transition">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- লগআউট বাটন -->
            <button onclick="logout()" class="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-2xl text-xs flex items-center gap-2 border border-red-200 transition shadow-2xs">
                <i class="fa-solid fa-power-off text-xs"></i> লগআউট করুন
            </button>
        </div>

        <!-- ২. ওয়ালেট ও দ্রুত উইথড্র উইজেট -->
        <div class="bg-gradient-to-tr from-gray-950 via-gray-900 to-gray-800 text-white p-6 sm:p-7 rounded-[32px] shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5">
            <div>
                <span class="text-[11px] font-black uppercase tracking-wider text-gray-400 block">উত্তোলনযোগ্য ব্যালেন্স</span>
                <span class="text-3xl sm:text-4xl font-black text-yellow-400">৳ <span id="accBalance">0.00</span></span>
                <p class="text-[11px] text-gray-400 mt-1">উত্তোলনের শর্ত: নূন্যতম ৩৫০ টাকা ও ৫টি সফল রেফার।</p>
            </div>
            
            <a href="/withdraw" class="px-6 py-3.5 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-black rounded-2xl text-xs flex items-center gap-2 shadow-md shadow-yellow-400/20 hover:scale-105 transition">
                <i class="fa-solid fa-wallet text-sm"></i> টাকা উত্তোলন (Withdraw)
            </a>
        </div>

        <!-- ৩. কুইক অ্যাকাউন্ট নেভিগেশন শর্টকাটস -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
            <a href="/history" class="bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-gray-200/80 shadow-2xs hover:border-purple-300 hover:shadow-xs transition flex flex-col items-center group">
                <span class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-base mb-1.5 group-hover:scale-105 transition">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </span>
                <span class="text-xs font-bold text-gray-800">কাজের হিস্টোরি</span>
            </a>

            <a href="/refer" class="bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-gray-200/80 shadow-2xs hover:border-green-300 hover:shadow-xs transition flex flex-col items-center group">
                <span class="w-10 h-10 rounded-xl bg-green-100 text-green-600 flex items-center justify-center text-base mb-1.5 group-hover:scale-105 transition">
                    <i class="fa-solid fa-gift"></i>
                </span>
                <span class="text-xs font-bold text-gray-800">রেফার ও আর্ন</span>
            </a>

            <a href="/withdraw" class="bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-gray-200/80 shadow-2xs hover:border-emerald-300 hover:shadow-xs transition flex flex-col items-center group">
                <span class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-base mb-1.5 group-hover:scale-105 transition">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </span>
                <span class="text-xs font-bold text-gray-800">উইথড্র স্ট্যাটাস</span>
            </a>

            <a href="/video" class="bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-gray-200/80 shadow-2xs hover:border-red-300 hover:shadow-xs transition flex flex-col items-center group">
                <span class="w-10 h-10 rounded-xl bg-red-100 text-red-600 flex items-center justify-center text-base mb-1.5 group-hover:scale-105 transition">
                    <i class="fa-solid fa-circle-play"></i>
                </span>
                <span class="text-xs font-bold text-gray-800">ভিডিও গাইড</span>
            </a>
        </div>

        <!-- ৪. পাসওয়ার্ড পরিবর্তন ফর্ম (সিকিউরিটি কার্ড) -->
        <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-7 rounded-[32px] border border-gray-200/80 shadow-xl shadow-yellow-500/5 space-y-4">
            <h3 class="text-base font-black text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-lock text-yellow-500"></i> পাসওয়ার্ড পরিবর্তন করুন
            </h3>

            <form id="passForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- বর্তমান পাসওয়ার্ড -->
                <div class="space-y-1">
                    <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider">বর্তমান পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="oldPass" placeholder="••••••••" required 
                               class="w-full text-xs pl-9 pr-10 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200">
                        <button type="button" onclick="togglePass('oldPass', 'oldEye')" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-black">
                            <i id="oldEye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- নতুন পাসওয়ার্ড -->
                <div class="space-y-1">
                    <label class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider">নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 text-xs">
                            <i class="fa-solid fa-shield-halved"></i>
                        </span>
                        <input type="password" id="newPass" minlength="6" placeholder="নতুন পাসওয়ার্ড দিন" required 
                               class="w-full text-xs pl-9 pr-10 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-yellow-400 bg-gray-50/60 focus:bg-white transition-all duration-200">
                        <button type="button" onclick="togglePass('newPass', 'newEye')" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-black">
                            <i id="newEye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div class="sm:col-span-2 pt-1">
                    <button type="submit" id="passBtn" class="px-6 py-3 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-black rounded-2xl text-xs shadow-xs hover:scale-105 active:scale-95 transition">
                        পাসওয়ার্ড আপডেট করুন
                    </button>
                </div>
            </form>
        </div>

    </main>

    <script>
        const user = getUser();

        // ১. প্রোফাইল ডাটা ডিসপ্লে
        if (user) {
            document.getElementById('accName').innerText = user.name;
            document.getElementById('accEmail').innerText = user.email || 'ইমেইল সংযুক্ত আছে';
            document.getElementById('accRefId').innerText = user.user_id;
            document.getElementById('accBalance').innerText = parseFloat(user.balance || 0).toFixed(2);
        }

        function copyCodeText() {
            if (user && user.user_id) {
                navigator.clipboard.writeText(user.user_id);
                alert("রেফারেল কোড কপি হয়েছে: " + user.user_id);
            }
        }

        // ২. পাসওয়ার্ড শো / হাইড
        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash text-xs text-yellow-600";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye text-xs text-gray-400";
            }
        }

        // ৩. পাসওয়ার্ড পরিবর্তনের রিকোয়েস্ট
        document.getElementById('passForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('passBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> পরিবর্তন হচ্ছে...`;
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/user/change-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: user.id,
                        old_password: document.getElementById('oldPass').value,
                        new_password: document.getElementById('newPass').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(data.message);
                document.getElementById('passForm').reset();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerHTML = `পাসওয়ার্ড আপডেট করুন`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
