<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অ্যাকাউন্ট - TaskBee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-24 sm:pb-12">
    <script>checkAuth();</script>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- ১. প্রোফাইল হেডার কার্ড (Honey Avatar সহ) -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-4">
                
                <!-- মধুর কিউট এভাটার (Honey Avatar) -->
                <div class="w-16 h-16 rounded-2xl bg-yellow-100 border-2 border-yellow-400 p-1 flex items-center justify-center shadow-sm overflow-hidden flex-shrink-0">
                    <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png" 
                         alt="Honey Pot" 
                         class="w-full h-full object-contain transform hover:scale-110 transition duration-200">
                </div>

                <div>
                    <h2 id="accName" class="text-xl font-black text-gray-900">লোড হচ্ছে...</h2>
                    <p id="accEmail" class="text-xs text-gray-500">email@example.com</p>
                    <div class="mt-1">
                        <span class="text-[11px] bg-yellow-100 text-yellow-800 font-bold px-2.5 py-1 rounded-md inline-block">
                            রেফারেল আইডি: <b id="accRefId" class="tracking-widest">-----</b>
                        </span>
                    </div>
                </div>
            </div>
            
            <button onclick="logout()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs flex items-center gap-2 border border-red-200 transition shadow-sm">
                <i class="fa-solid fa-power-off"></i> লগআউট
            </button>
        </div>

        <!-- ২. ওয়ালেট ও উইথড্র উইজেট -->
        <div class="bg-gradient-to-r from-gray-950 via-gray-900 to-gray-800 text-white p-6 rounded-3xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider block">উত্তোলনযোগ্য ব্যালেন্স</span>
                <span class="text-3xl font-black text-yellow-400">৳ <span id="accBalance">0.00</span></span>
            </div>
            <button onclick="openWithdrawModal()" class="px-6 py-3 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-bold rounded-xl text-xs flex items-center gap-2 shadow-md transition">
                <i class="fa-solid fa-wallet"></i> টাকা উত্তোলন (Withdraw)
            </button>
        </div>

        <!-- ৩. সিকিউরিটি / পাসওয়ার্ড পরিবর্তন ফর্ম -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4">
            <h3 class="text-base font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-lock text-yellow-500"></i> পাসওয়ার্ড পরিবর্তন করুন
            </h3>

            <form id="passForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">বর্তমান পাসওয়ার্ড</label>
                    <input type="password" id="oldPass" required class="w-full text-xs p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">নতুন পাসওয়ার্ড</label>
                    <input type="password" id="newPass" required minlength="6" class="w-full text-xs p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" id="passBtn" class="px-5 py-2.5 bg-yellow-400 hover:bg-yellow-500 font-bold rounded-xl text-xs shadow-sm transition">
                        পাসওয়ার্ড আপডেট করুন
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- উইথড্র পপআপ মডাল -->
    <div id="withdrawModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-xl text-center">
            <div class="w-12 h-12 bg-yellow-100 text-yellow-700 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <h3 class="font-black text-lg text-gray-900">টাকা উত্তোলন (বিকাশ / নগদ)</h3>
            <p class="text-xs text-gray-500">নূন্যতম উত্তোলন ৫০ টাকা। খুব শীঘ্রই চালু হবে।</p>
            <div class="space-y-2 text-left">
                <input type="text" placeholder="বিকাশ বা নগদ নম্বর" class="w-full text-xs p-3 border rounded-xl">
                <input type="number" placeholder="টাকার পরিমাণ (৳)" class="w-full text-xs p-3 border rounded-xl">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeWithdrawModal()" class="w-1/2 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs">বাতিল</button>
                <button onclick="alert('আপনার উত্তোলনের রিকোয়েস্ট গ্রহণ করা হয়েছে!'); closeWithdrawModal();" class="w-1/2 py-2.5 bg-yellow-400 font-bold rounded-xl text-xs hover:bg-yellow-500">সাবমিট</button>
            </div>
        </div>
    </div>

    <script>
        const user = getUser();

        // প্রোফাইল ডাটা ডিসপ্লে
        if (user) {
            document.getElementById('accName').innerText = user.name;
            document.getElementById('accEmail').innerText = user.email || 'ইমেইল সংযুক্ত আছে';
            document.getElementById('accRefId').innerText = user.user_id;
            document.getElementById('accBalance').innerText = parseFloat(user.balance || 0).toFixed(2);
        }

        // পাসওয়ার্ড পরিবর্তনের রিকোয়েস্ট
        document.getElementById('passForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('passBtn');
            btn.innerText = "পরিবর্তন হচ্ছে...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/user/change-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: user.id,
                        old_password: document.getElementById('oldPass').value,
                        new_password: document.getElementById('newPass').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(data.message);
                document.getElementById('passForm').reset();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = "পাসওয়ার্ড আপডেট করুন";
                btn.disabled = false;
            }
        });

        function openWithdrawModal() { document.getElementById('withdrawModal').classList.remove('hidden'); }
        function closeWithdrawModal() { document.getElementById('withdrawModal').classList.add('hidden'); }
    </script>
</body>
                  </html>
