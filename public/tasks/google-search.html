<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Task - TaskBee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/main.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 text-gray-800">
    <script>checkAuth();</script>

    <div class="max-w-xl mx-auto space-y-4">
        <div class="flex items-center justify-between">
            <a href="/dashboard.html" class="text-sm font-bold text-yellow-700 hover:underline">&larr; ড্যাশবোর্ডে ফিরুন</a>
            <h2 class="text-lg font-black text-gray-800">গুগল সার্চ টাস্ক</h2>
        </div>

        <div id="taskList" class="space-y-4">
            <p class="text-center text-gray-400 text-sm py-8">টাস্ক লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- স্ক্রিনশট জমা দেওয়ার পপআপ মডাল -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="font-black text-lg text-gray-900">স্ক্রিনশট প্রুফ দিন</h3>
            <p class="text-xs text-gray-500">গুগলে গিয়ে কীওয়ার্ডটি সার্চ করে রেজাল্ট পেজের একটি স্ক্রিনশট আপলোড করুন।</p>
            
            <form id="uploadForm" class="space-y-4">
                <input type="hidden" id="currentTaskId">
                <input type="file" id="ssFile" accept="image/*" required class="w-full text-xs border p-2.5 rounded-xl border-dashed border-gray-400 bg-gray-50">

                <div class="flex gap-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-xl text-sm">বাতিল</button>
                    <button type="submit" id="submitBtn" class="w-1/2 py-2.5 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold rounded-xl text-sm shadow">জমা দিন</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const user = getUser();

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks/google-search`);
                const tasks = await res.json();
                const container = document.getElementById('taskList');
                container.innerHTML = "";

                if (tasks.length === 0) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-500 shadow-sm border">বর্তমানে কোনো টাস্ক নেই। কিছুক্ষণ পর আবার চেষ্টা করুন।</div>`;
                    return;
                }

                tasks.forEach(t => {
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-gray-900">${t.title}</h4>
                                <span class="bg-green-100 text-green-700 font-black px-2.5 py-1 rounded-lg text-sm">৳ ${t.reward_amount}</span>
                            </div>
                            <div class="bg-yellow-50 p-3 rounded-xl border border-yellow-200 text-xs">
                                <span class="text-gray-500 block mb-0.5">গুগলে এই কীওয়ার্ডটি লিখে সার্চ করুন:</span>
                                <span class="font-bold text-blue-600 text-sm select-all">${t.keyword}</span>
                            </div>
                            <button onclick="openModal(${t.id})" class="w-full py-2.5 bg-yellow-400 hover:bg-yellow-500 font-bold rounded-xl text-sm transition shadow-sm">স্ক্রিনশট জমা দিন</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        function openModal(id) {
            document.getElementById('currentTaskId').value = id;
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "আপলোড হচ্ছে...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('task_id', document.getElementById('currentTaskId').value);
            formData.append('user_id', user.id);
            formData.append('screenshot', document.getElementById('ssFile').files[0]);

            try {
                const res = await fetch(`${API_URL}/tasks/submit-google-search`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(data.message);
                closeModal();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = "জমা দিন";
                btn.disabled = false;
            }
        });

        fetchTasks();
    </script>
</body>
</html>
