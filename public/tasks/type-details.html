<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাইপিং ওয়ার্কস্পেস - TaskBee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-24 sm:pb-12">
    <script>checkAuth();</script>

    <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">

        <a href="/tasks/type" class="text-xs font-bold text-yellow-600 hover:underline flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> সকল টাইপিং টাস্কে ফিরুন
        </a>

        <!-- ১. টাস্ক হেডার -->
        <div class="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm flex justify-between items-center">
            <div>
                <span class="text-[10px] font-black uppercase text-yellow-600 bg-yellow-100 px-2.5 py-0.5 rounded-md inline-block mb-1">ইমেজ টু টেক্সট</span>
                <h2 id="taskTitle" class="text-lg sm:text-xl font-black text-gray-900">লোড হচ্ছে...</h2>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-gray-400 uppercase font-bold block">পুরস্কার</span>
                <span class="text-2xl font-black text-green-600">৳ <span id="taskReward">0.00</span></span>
            </div>
        </div>

        <!-- পূর্ববর্তী সাবমিশন থাকলে অ্যালার্ট (রিজেক্ট হলে কারণ সহ দেখাবে) -->
        <div id="statusAlert" class="hidden p-4 rounded-3xl text-xs font-bold shadow-xs"></div>

        <!-- ২. ছবি ও টাইপিং এরিয়া -->
        <div id="workspaceContainer" class="bg-white p-6 rounded-3xl border border-gray-200 shadow-sm space-y-4">
            
            <!-- ছবি প্রিভিউ বক্স -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-700">ছবিটি দেখে হুবহু টাইপ করুন:</span>
                    <a id="openFullImgBtn" href="#" target="_blank" class="text-[11px] text-blue-600 font-bold hover:underline">
                        ছবি বড় করে দেখুন <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                    </a>
                </div>
                <div class="border rounded-2xl p-2 bg-gray-50 flex items-center justify-center">
                    <img id="taskImage" src="#" alt="Typing Image" class="max-h-72 object-contain rounded-xl">
                </div>
            </div>

            <!-- টাইপিং ইনপুট ফর্ম -->
            <form id="typingSubmitForm" class="space-y-4">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-gray-700 uppercase">আপনার টাইপ করা লেখা</label>
                        <span id="charCount" class="text-[10px] text-gray-400 font-mono">০ অক্ষর</span>
                    </div>
                    <textarea id="typedText" rows="6" onkeyup="updateCount()" placeholder="এখানে দেখে দেখে টাইপ করুন (বানান এবং লাইনের দিকে সতর্ক থাকুন)..." required 
                              class="w-full text-xs p-3.5 border rounded-2xl focus:ring-2 focus:ring-yellow-400 focus:outline-none font-sans leading-relaxed"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-black rounded-2xl text-xs shadow-sm transition">
                    লেখা জমা দিন (Submit Typing)
                </button>
            </form>

        </div>

    </main>

    <script>
        const user = getUser();
        const taskId = new URLSearchParams(window.location.search).get('id');

        if (!taskId) {
            alert("টাস্ক পাওয়া যায়নি!");
            window.location.href = "/tasks/type";
        }

        async function initWorkspace() {
            try {
                const res = await fetch(`${API_URL}/tasks/single/${taskId}`);
                const task = await res.json();

                document.getElementById('taskTitle').innerText = task.title;
                document.getElementById('taskReward').innerText = parseFloat(task.reward_amount).toFixed(2);
                document.getElementById('taskImage').src = task.image_url;
                document.getElementById('openFullImgBtn').href = task.image_url;

                // ইউজারের সাবমিশন স্ট্যাটাস চেক
                const statusRes = await fetch(`${API_URL}/tasks/submission-status?task_id=${taskId}&user_id=${user.id}`);
                const statusData = await statusRes.json();

                if (statusData) {
                    const alertBox = document.getElementById('statusAlert');
                    const formContainer = document.getElementById('workspaceContainer');

                    if (statusData.status === 'approved') {
                        alertBox.className = "p-5 bg-green-50 border border-green-200 text-green-800 rounded-3xl text-xs";
                        alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-sm mr-1"></i> আপনি ইতিমধ্যে কাজটি সফলভাবে সম্পন্ন করেছেন এবং ব্যালেন্স যোগ হয়েছে।`;
                        alertBox.classList.remove('hidden');
                        formContainer.classList.add('hidden');
                    } else if (statusData.status === 'pending') {
                        alertBox.className = "p-5 bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-3xl text-xs";
                        alertBox.innerHTML = `<i class="fa-solid fa-hourglass-half text-sm mr-1"></i> আপনার টাইপিংটি এডমিন রিভিউ করছে। অনুগ্রহ করে অপেক্ষা করুন।`;
                        alertBox.classList.remove('hidden');
                        formContainer.classList.add('hidden');
                    } else if (statusData.status === 'rejected') {
                        // রিজেক্ট হলে পুনরায় করার সুযোগ
                        alertBox.className = "p-4 bg-red-50 border border-red-200 text-red-800 rounded-2xl text-xs";
                        alertBox.innerHTML = `<i class="fa-solid fa-xmark text-sm mr-1"></i> আগের টাইপিং বাতিল করা হয়েছিল! <b>কারণ: ${statusData.admin_note || 'ভুল টাইপিং'}</b>। নিচে আবার সঠিক নিয়মে লিখে জমা দিন।`;
                        alertBox.classList.remove('hidden');
                    }
                }
            } catch (err) {
                alert("লোড করা যায়নি!");
            }
        }

        function updateCount() {
            const len = document.getElementById('typedText').value.length;
            document.getElementById('charCount').innerText = `${len} অক্ষর`;
        }

        document.getElementById('typingSubmitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> জমা হচ্ছে...`;
            btn.disabled = true;

            const formData = new FormData();
            formData.append('task_id', taskId);
            formData.append('user_id', user.id);
            formData.append('submitted_text', document.getElementById('typedText').value);

            try {
                const res = await fetch(`${API_URL}/tasks/submit-typing`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(data.message);
                window.location.reload();
            } catch (err) {
                alert(err.message);
                btn.innerHTML = `লেখা জমা দিন (Submit Typing)`;
                btn.disabled = false;
            }
        });

        initWorkspace();
    </script>
</body>
</html>
