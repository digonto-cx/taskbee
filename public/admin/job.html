<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সোশ্যাল জব পোস্ট ম্যানেজার - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>

    <style>
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-popIn { animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20 selection:bg-yellow-400">

    <!-- হেডার -->
    <header class="bg-gray-950 text-white px-6 py-3.5 flex justify-between items-center shadow-md sticky top-0 z-40">
        <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black"><i class="fa-solid fa-share-nodes"></i></span>
            <h1 class="font-black text-lg text-yellow-400">Social Job Post Manager</h1>
        </div>
        <a href="/admin" class="text-xs bg-gray-800 hover:bg-gray-700 px-3.5 py-1.5 rounded-xl font-bold text-gray-300 transition flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-xs"></i> মূল এডমিন প্যানেল
        </a>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- ১. নতুন জব পোস্ট তৈরি ফর্ম -->
        <div class="bg-white p-6 sm:p-7 rounded-[28px] border border-gray-200/80 shadow-xs space-y-4">
            <h3 class="font-bold text-gray-900 text-base flex items-center gap-2 border-b pb-3 border-gray-100">
                <i class="fa-brands fa-facebook text-blue-600 text-lg"></i> নতুন ফেসবুক গ্রুপ জব তৈরি করুন
            </h3>

            <form id="createJobForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-gray-600 mb-1">টাস্ক শিরোনাম (Title)</label>
                        <input type="text" id="jobTitle" placeholder="যেমন: ফেসবুক আর্নিং গ্রুপে পোস্ট করুন" required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">পুরস্কারের টাকা (৳ Price)</label>
                        <input type="number" id="jobReward" placeholder="যেমন: 3.50" step="0.5" required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">কাজের সাধারণ নিয়মাবলী (Description)</label>
                    <textarea id="jobDesc" rows="2" placeholder="ইউজার কোন ধরণের গ্রুপে পোস্ট করবে তার নিয়ম লিখুন..." required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">পোস্টের ক্যাপশন (যেটি ইউজার কপি করে পোস্ট করবে)</label>
                    <textarea id="jobCaption" rows="3" placeholder="ফেসবুকে পোস্ট করার পুরো ক্যাপশনটি এখানে লিখুন..." required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-sans leading-relaxed"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">পোস্টের ছবি (Post Image - ImgBB-তে আপলোড হবে)</label>
                    <input type="file" id="jobImageFile" accept="image/*" required class="w-full text-xs p-2.5 border border-dashed rounded-xl bg-gray-50">
                </div>

                <button type="submit" id="jobBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl text-xs shadow-xs transition hover:scale-[1.01]">
                    জব টাস্ক পাবলিশ করুন
                </button>
            </form>
        </div>

        <!-- ২. পেন্ডিং ফেসবুক জব সাবমিশন ভেরিফিকেশন প্যানেল -->
        <div class="bg-white p-6 sm:p-7 rounded-[28px] border border-gray-200/80 shadow-xs space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 pb-3 border-b border-gray-100">
                <div>
                    <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check text-blue-600"></i> পেন্ডিং ফেসবুক পোস্ট রিভিউ
                    </h3>
                    <p class="text-xs text-gray-400">ইউজারদের ফেসবুক পোস্টের স্ক্রিনশট যাচাই করে অ্যাপ্রুভ বা রিজেক্ট করুন</p>
                </div>

                <button onclick="loadPendingJobSubmissions()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3.5 py-2 rounded-xl font-bold text-gray-600 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> রিফ্রেশ
                </button>
            </div>

            <!-- সাবমিশন লিস্ট -->
            <div id="jobSubmissionsList" class="space-y-4">
                <p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>
            </div>
        </div>

    </main>

    <!-- স্ক্রিনশট প্রিভিউ লাইটবক্স মডাল -->
    <div id="imagePreviewModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-popIn">
        <div class="bg-white rounded-3xl max-w-sm w-full p-4 space-y-3 shadow-2xl relative border border-gray-200">
            <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                <h4 class="font-bold text-xs text-gray-800">পোস্টের স্ক্রিনশট প্রিভিউ</h4>
                <button onclick="closePreviewModal()" class="text-gray-400 hover:text-black">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <img id="previewImageSrc" src="#" alt="Screenshot" class="w-full max-h-80 object-contain rounded-xl border border-gray-100 bg-gray-50">
            <a id="previewImageLink" href="#" target="_blank" class="block text-center text-xs text-blue-600 font-bold hover:underline">
                আসল ছবি নতুন ট্যাবে দেখুন <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
        </div>
    </div>

    <script>
        const adminUser = getUser();
        if (!adminUser || adminUser.role !== 'admin') {
            alert("শুধুমাত্র এডমিনের প্রবেশের অনুমতি আছে!");
            window.location.replace("/login");
        }

        // ১. নতুন ফেসবুক জব পোস্ট তৈরি
        document.getElementById('createJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('jobBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ছবি ImgBB-তে আপলোড হচ্ছে...`;
            btn.disabled = true;

            const formData = new FormData();
            formData.append('title', document.getElementById('jobTitle').value);
            formData.append('description', document.getElementById('jobDesc').value);
            formData.append('caption', document.getElementById('jobCaption').value);
            formData.append('reward_amount', document.getElementById('jobReward').value);
            formData.append('image', document.getElementById('jobImageFile').files[0]);

            try {
                const res = await fetch(`${API_URL}/admin/tasks/job`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);

                alert(data.message);
                document.getElementById('createJobForm').reset();
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerHTML = `জব টাস্ক পাবলিশ করুন`;
                btn.disabled = false;
            }
        });

        // ২. পেন্ডিং ফেসবুক জব সাবমিশন লোড
        async function loadPendingJobSubmissions() {
            const container = document.getElementById('jobSubmissionsList');
            container.innerHTML = `<p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>`;

            try {
                const res = await fetch(`${API_URL}/admin/job/pending`);
                const data = await res.json();
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-400 py-8 text-center"><i class="fa-solid fa-circle-check text-2xl text-blue-500 mb-2 block"></i>কোনো পেন্ডিং ফেসবুক জব সাবমিশন নেই!</p>`;
                    return;
                }

                data.forEach(sub => {
                    container.innerHTML += `
                        <div class="p-4 sm:p-5 bg-gray-50 border border-gray-200 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:bg-white transition">
                            <div class="space-y-1">
                                <h4 class="font-bold text-gray-900 text-sm flex items-center gap-1.5">
                                    <i class="fa-brands fa-facebook text-blue-600"></i> ${sub.tasks.title} - <b class="text-green-600">৳${sub.tasks.reward_amount}</b>
                                </h4>
                                <p class="text-xs text-gray-500">ইউজার: <b>${sub.users.name}</b> (ID: ${sub.users.user_id})</p>
                                
                                <div class="pt-1">
                                    <button onclick="openPreviewModal('${sub.screenshot_url}')" class="inline-flex items-center gap-1.5 text-xs text-blue-600 font-bold hover:underline">
                                        <i class="fa-solid fa-image"></i> পোস্টের স্ক্রিনশট প্রিভিউ দেখুন
                                    </button>
                                </div>
                            </div>

                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="actionJob(${sub.id}, 'approve')" class="flex-1 sm:flex-initial px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-check mr-1"></i> Approve (ব্যালেন্স যোগ)
                                </button>
                                <button onclick="actionJob(${sub.id}, 'reject')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-xmark mr-1"></i> Reject
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 py-4 text-center">ডাটা লোড করা যায়নি!</p>`;
            }
        }

        // ৩. অ্যাপ্রুভ বা রিজেক্ট অ্যাকশন
        async function actionJob(id, act) {
            const note = act === 'reject' ? prompt("রিজেক্ট করার কারণ লিখুন:") : "";
            if (act === 'reject' && note === null) return;

            try {
                const res = await fetch(`${API_URL}/admin/submissions/action`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ submission_id: id, action: act, admin_note: note || "" })
                });
                const data = await res.json();
                alert(data.message);
                loadPendingJobSubmissions();
            } catch (e) {
                alert("অ্যাকশন সম্পন্ন করতে সমস্যা হয়েছে!");
            }
        }

        // ৪. স্ক্রিনশট প্রিভিউ লাইটবক্স
        function openPreviewModal(url) {
            document.getElementById('previewImageSrc').src = url;
            document.getElementById('previewImageLink').href = url;
            document.getElementById('imagePreviewModal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('imagePreviewModal').classList.add('hidden');
        }

        loadPendingJobSubmissions();
    </script>
</body>
</html>
