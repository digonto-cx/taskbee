<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBee - এডমিন কন্ট্রোল প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-16">

    <!-- এডমিন হেডার -->
    <header class="bg-gray-950 text-white sticky top-0 z-40 border-b border-gray-800 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-yellow-400/20 border border-yellow-400/40 p-1 flex items-center justify-center">
                    <img src="https://i.ibb.co.com/PZV16bNp/file-00000000bea481f5b7ca59b2fe930fea.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="font-black text-lg text-yellow-400 leading-none">TaskBee Admin</h1>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Super Control Panel</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl font-bold transition">
                    <i class="fa-solid fa-eye mr-1"></i> সাইট দেখুন
                </a>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl font-bold transition">
                    <i class="fa-solid fa-power-off mr-1"></i> লগআউট
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- ১. এডমিন কন্ট্রোল ট্যাব মেনু -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none text-xs font-bold">
            <button onclick="switchTab('tab-tasks-verify')" id="btn-tasks-verify" class="tab-btn px-4 py-2.5 bg-yellow-400 text-gray-950 rounded-2xl whitespace-nowrap shadow-xs flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i> স্ক্রিনশট ভেরিফিকেশন
            </button>
            <button onclick="switchTab('tab-withdrawals')" id="btn-withdrawals" class="tab-btn px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl whitespace-nowrap hover:bg-gray-50 flex items-center gap-2">
                <i class="fa-solid fa-money-bill-transfer text-emerald-600"></i> উইথড্র রিকোয়েস্ট
            </button>
            <button onclick="switchTab('tab-create-task')" id="btn-create-task" class="tab-btn px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl whitespace-nowrap hover:bg-gray-50 flex items-center gap-2">
                <i class="fa-solid fa-plus text-blue-600"></i> নতুন টাস্ক তৈরি
            </button>
            <button onclick="switchTab('tab-notice')" id="btn-notice" class="tab-btn px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl whitespace-nowrap hover:bg-gray-50 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-yellow-600"></i> গ্লোবাল নোটিশ
            </button>
            <button onclick="switchTab('tab-imgbb')" id="btn-imgbb" class="tab-btn px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl whitespace-nowrap hover:bg-gray-50 flex items-center gap-2">
                <i class="fa-solid fa-key text-purple-600"></i> ImgBB Keys
            </button>
        </div>

        <!-- ==================== ট্যাব ১: স্ক্রিনশট ভেরিফিকেশন ==================== -->
        <div id="tab-tasks-verify" class="tab-content bg-white p-6 rounded-3xl border border-gray-200 shadow-xs space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                    <i class="fa-solid fa-camera text-yellow-500"></i> পেন্ডিং গুগল সার্চ স্ক্রিনশট
                </h3>
                <button onclick="loadSubmissions()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl font-bold text-gray-600">
                    <i class="fa-solid fa-rotate-right mr-1"></i> রিফ্রেশ
                </button>
            </div>

            <div id="submissionsList" class="space-y-3">
                <p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- ==================== ট্যাব ২: উইথড্র রিকোয়েস্ট ==================== -->
        <div id="tab-withdrawals" class="tab-content hidden bg-white p-6 rounded-3xl border border-gray-200 shadow-xs space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-transfer text-emerald-600"></i> পেন্ডিং টাকা উত্তোলনের তালিকা
                </h3>
                <button onclick="loadWithdrawals()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-xl font-bold text-gray-600">
                    <i class="fa-solid fa-rotate-right mr-1"></i> রিফ্রেশ
                </button>
            </div>

            <div id="withdrawalsList" class="space-y-3">
                <p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- ==================== ট্যাব ৩: নতুন টাস্ক তৈরি ==================== -->
        <div id="tab-create-task" class="tab-content hidden bg-white p-6 rounded-3xl border border-gray-200 shadow-xs space-y-4">
            <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-blue-600"></i> নতুন গুগল সার্চ টাস্ক যোগ করুন
            </h3>
            
            <form id="createTaskForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-gray-600 mb-1">টাস্ক শিরোনাম (Title)</label>
                    <input type="text" id="taskTitle" placeholder="যেমন: Search Tech Website on Google" required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">পুরস্কারের টাকা (৳)</label>
                    <input type="number" id="taskReward" placeholder="যেমন: 2.50" step="0.5" required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-bold text-gray-600 mb-1">সার্চ করার কীওয়ার্ড (Keyword)</label>
                    <input type="text" id="taskKeyword" placeholder="যেমন: best hosting in bd 2024" required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none font-mono">
                </div>
                <div class="sm:col-span-3 pt-2">
                    <button type="submit" id="createTaskBtn" class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-bold rounded-2xl text-xs shadow-sm transition">
                        টাস্ক পাবলিশ করুন
                    </button>
                </div>
            </form>
        </div>

        <!-- ==================== ট্যাব ৪: গ্লোবাল নোটিশ ==================== -->
        <div id="tab-notice" class="tab-content hidden bg-white p-6 rounded-3xl border border-gray-200 shadow-xs space-y-4">
            <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-yellow-500"></i> ড্যাশবোর্ড গ্লোবাল নোটিশ কন্ট্রোল
            </h3>

            <form id="adminNoticeForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">নোটিশ টেক্সট</label>
                    <textarea id="adminNoticeText" rows="3" placeholder="ইউজারদের ওয়েলকাম পপআপে দেখানোর জন্য নোটিশ লিখুন..." required class="w-full text-xs p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer">
                        <input type="checkbox" id="adminNoticeStatus" checked class="w-4 h-4 text-yellow-500 rounded">
                        নোটিশটি চালু রাখুন (Show in Popup)
                    </label>
                    <button type="submit" id="saveNoticeBtn" class="px-6 py-2.5 bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-bold rounded-xl text-xs shadow-sm transition">
                        নোটিশ সেভ করুন
                    </button>
                </div>
            </form>
        </div>

        <!-- ==================== ট্যাব ৫: ImgBB Keys ==================== -->
        <div id="tab-imgbb" class="tab-content hidden bg-white p-6 rounded-3xl border border-gray-200 shadow-xs space-y-4">
            <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
                <i class="fa-solid fa-key text-purple-600"></i> ImgBB API Key রোটেশন
            </h3>
            
            <form id="addKeyForm" class="flex gap-2">
                <input type="text" id="newApiKey" placeholder="নতুন ImgBB API Key পেস্ট করুন..." required class="flex-1 text-xs p-3 border rounded-xl focus:ring-2 focus:ring-yellow-400 focus:outline-none font-mono">
                <button type="submit" class="px-5 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-sm transition">
                    + কী যুক্ত করুন
                </button>
            </form>

            <div class="pt-2">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">সক্রিয় কী-গুলোর তালিকা:</h4>
                <div id="keysList" class="space-y-2">
                    <p class="text-xs text-gray-400 py-4 text-center">কী লোড হচ্ছে...</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // এডমিন অথেনটিকেশন চেক
        const adminUser = getUser();
        if (!adminUser || adminUser.role !== 'admin') {
            alert("শুধুমাত্র এডমিনদের প্রবেশের অনুমতি আছে!");
            window.location.href = "/login";
        }

        // ট্যাব সুইচিং লজিক
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl whitespace-nowrap hover:bg-gray-50 flex items-center gap-2";
            });
            event.currentTarget.className = "tab-btn px-4 py-2.5 bg-yellow-400 text-gray-950 font-bold rounded-2xl whitespace-nowrap shadow-xs flex items-center gap-2";

            if (tabId === 'tab-tasks-verify') loadSubmissions();
            if (tabId === 'tab-withdrawals') loadWithdrawals();
            if (tabId === 'tab-notice') loadAdminNotice();
            if (tabId === 'tab-imgbb') loadImgbbKeys();
        }

        // ১. পেন্ডিং স্ক্রিনশট লোড ও একশন
        async function loadSubmissions() {
            const container = document.getElementById('submissionsList');
            container.innerHTML = `<p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>`;
            try {
                const res = await fetch(`${API_URL}/admin/submissions/pending`);
                const data = await res.json();
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-400 py-8 text-center"><i class="fa-solid fa-circle-check text-2xl text-green-500 mb-2 block"></i>কোনো পেন্ডিং স্ক্রিনশট নেই!</p>`;
                    return;
                }

                data.forEach(sub => {
                    container.innerHTML += `
                        <div class="p-4 bg-gray-50 border border-gray-200 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h4 class="font-bold text-gray-900">${sub.tasks.title} &bull; <b class="text-green-600">৳${sub.tasks.reward_amount}</b></h4>
                                <p class="text-xs text-gray-500">ইউজার: <b>${sub.users.name}</b> (ID: ${sub.users.user_id})</p>
                                <a href="${sub.screenshot_url}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-blue-600 font-bold hover:underline mt-1">
                                    <i class="fa-solid fa-image"></i> স্ক্রিনশট দেখুন (নতুন ট্যাবে ওপেন)
                                </a>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="actionTask(${sub.id}, 'approve')" class="flex-1 sm:flex-initial px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-check mr-1"></i> Approve
                                </button>
                                <button onclick="actionTask(${sub.id}, 'reject')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-xmark mr-1"></i> Reject
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 py-4 text-center">ডাটা আনতে সমস্যা হয়েছে!</p>`;
            }
        }

        async function actionTask(id, act) {
            const note = act === 'reject' ? prompt("রিজেক্ট করার কারণ লিখুন:") : "";
            if (act === 'reject' && note === null) return;

            await fetch(`${API_URL}/admin/submissions/action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ submission_id: id, action: act, admin_note: note || "" })
            });
            alert(`টাস্কটি ${act === 'approve' ? 'অনুমোদিত' : 'রিজেক্ট'} হয়েছে!`);
            loadSubmissions();
        }

        // ২. উইথড্র রিকোয়েস্ট লোড ও একশন
        async function loadWithdrawals() {
            const container = document.getElementById('withdrawalsList');
            container.innerHTML = `<p class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</p>`;
            try {
                const res = await fetch(`${API_URL}/admin/withdrawals/pending`);
                const data = await res.json();
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-xs text-gray-400 py-8 text-center"><i class="fa-solid fa-circle-check text-2xl text-green-500 mb-2 block"></i>কোনো পেন্ডিং উইথড্র নেই!</p>`;
                    return;
                }

                data.forEach(w => {
                    container.innerHTML += `
                        <div class="p-4 bg-gray-50 border border-gray-200 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h4 class="font-black text-gray-900 text-base">৳ ${parseFloat(w.amount).toFixed(2)} &bull; <span class="text-yellow-600 font-bold">${w.method}</span></h4>
                                <p class="text-xs font-mono text-gray-800 mt-0.5">নম্বর: <b class="bg-yellow-100 px-1.5 py-0.5 rounded">${w.account_number}</b></p>
                                <p class="text-[11px] text-gray-500 mt-0.5">ইউজার: ${w.users.name} (ID: ${w.users.user_id})</p>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="actionWithdraw(${w.id}, 'approve')" class="flex-1 sm:flex-initial px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-check mr-1"></i> Paid (Approve)
                                </button>
                                <button onclick="actionWithdraw(${w.id}, 'reject')" class="flex-1 sm:flex-initial px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition">
                                    <i class="fa-solid fa-xmark mr-1"></i> Reject (Refund)
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 py-4 text-center">উইথড্র লোড করা যায়নি!</p>`;
            }
        }

        async function actionWithdraw(id, act) {
            if (!confirm(`আপনি কি নিশ্চিত এই উইথড্র রিকোয়েস্টটি ${act === 'approve' ? 'Paid করবেন' : 'Reject করবেন'}?`)) return;

            await fetch(`${API_URL}/admin/withdrawals/action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ withdrawal_id: id, action: act })
            });
            alert("উইথড্র স্ট্যাটাস আপডেট হয়েছে!");
            loadWithdrawals();
        }

        // ৩. টাস্ক তৈরি
        document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createTaskBtn');
            btn.innerText = "পাবলিশ হচ্ছে...";

            await fetch(`${API_URL}/admin/tasks/google-search`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('taskTitle').value,
                    keyword: document.getElementById('taskKeyword').value,
                    reward_amount: parseFloat(document.getElementById('taskReward').value)
                })
            });

            alert("টাস্ক সফলভাবে তৈরি হয়েছে!");
            document.getElementById('createTaskForm').reset();
            btn.innerText = "টাস্ক পাবলিশ করুন";
        });

        // ৪. নোটিশ লোড ও সেভ
        async function loadAdminNotice() {
            const res = await fetch(`${API_URL}/notice`);
            const data = await res.json();
            if (data.content) {
                document.getElementById('adminNoticeText').value = data.content;
                document.getElementById('adminNoticeStatus').checked = data.is_active;
            }
        }

        document.getElementById('adminNoticeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${API_URL}/admin/notice`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: document.getElementById('adminNoticeText').value,
                    is_active: document.getElementById('adminNoticeStatus').checked
                })
            });
            alert("গ্লোবাল নোটিশ আপডেট হয়েছে!");
        });

        // ৫. ImgBB Keys ম্যানেজ
        async function loadImgbbKeys() {
            const container = document.getElementById('keysList');
            const res = await fetch(`${API_URL}/admin/imgbb-keys`);
            const data = await res.json();
            container.innerHTML = "";

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-red-500 py-2">কোনো ImgBB Key যুক্ত নেই! দ্রুত একটি কী যোগ করুন।</p>`;
                return;
            }

            data.forEach((k, idx) => {
                container.innerHTML += `
                    <div class="p-3 bg-gray-50 border rounded-xl flex justify-between items-center text-xs">
                        <span class="font-mono text-gray-700">Key ${idx + 1}: ${k.api_key.substring(0, 8)}••••••••</span>
                        <button onclick="deleteKey(${k.id})" class="text-red-600 hover:text-red-800 font-bold px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        document.getElementById('addKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`${API_URL}/admin/imgbb-keys`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ api_key: document.getElementById('newApiKey').value })
            });
            alert("ImgBB কী সফলভাবে যুক্ত হয়েছে!");
            document.getElementById('newApiKey').value = "";
            loadImgbbKeys();
        });

        async function deleteKey(id) {
            if (!confirm("কীটি মুছে ফেলতে চান?")) return;
            await fetch(`${API_URL}/admin/imgbb-keys/${id}`, { method: 'DELETE' });
            loadImgbbKeys();
        }

        // শুরুতে প্রথম ট্যাব লোড
        loadSubmissions();
    </script>
</body>
</html>
